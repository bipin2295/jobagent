[project]
name = "job-application-agent"
version = "0.1.0"
description = "End-to-end autonomous job search and application agent"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlmodel>=0.0.21",
    "typer>=0.12",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "rich>=13.7",
    "httpx>=0.27",
    "anyio>=4.4",
    "click>=8.1",
    "python-dateutil>=2.9",
    "playwright>=1.65.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.50",
    "tiktoken>=0.7",
]
discovery = [
    "python-jobspy>=1.1",
    "feedparser>=6.0",
    "selectolax>=0.3",
    "markdownify>=0.13",
    "rapidfuzz>=3.9",
    "apify-client>=1.7",
    "firecrawl-py>=1.0",
]
browser = [
    "playwright>=1.44",
    "browser-use>=0.1",
    "playwright-stealth>=1.0",
]
profile-tools = [
    "pypdf>=4.3",
    "rendercv[full]>=1.14",
]
tracking = [
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.139",
    "python-telegram-bot>=21.5",
]
dashboard = [
    "streamlit>=1.37",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "types-python-dateutil>=2.9",
]

[project.scripts]
jobagent = "jobagent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobagent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PT"]
ignore = ["E501", "N999"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
